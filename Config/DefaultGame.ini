; the new-game story: one narrated line per shot (text in Story/intro_narration.txt)
+IntroShots=(Line=INVTEXT("Eldoria. A kingdom of quiet valleys and old forests, where villages slept safe behind the oath of their knights."),Narration=/Game/Audio/Recorded/Narration/Intro_01.Intro_01,Anchor=None,From=(X=-9000,Y=-9000,Z=4200),To=(X=-5200,Y=-6800,Z=3000),LookAt=(X=58,Y=194,Z=300),Fov=50)
+IntroShots=(Line=INVTEXT("For three hundred years, the Royal Key kept that peace. Forged by the first kings, it sealed away every dark thing that hungered for this land."),Narration=/Game/Audio/Recorded/Narration/Intro_02.Intro_02,Anchor=None,From=(X=5200,Y=-4800,Z=2800),To=(X=4400,Y=2600,Z=2300),LookAt=(X=0,Y=200,Z=300),Fov=50)
+IntroShots=(Line=INVTEXT("But Mordrak, the king's own sorcerer, feared one thing above all else. His own death."),Narration=/Game/Audio/Recorded/Narration/Intro_03.Intro_03,Anchor=Objective_Boss,From=(X=-850,Y=750,Z=120),To=(X=-480,Y=420,Z=40),LookAt=(X=0,Y=0,Z=40),Fov=45)
+IntroShots=(Line=INVTEXT("He stole the Royal Key, and in the Sky Shrine above the eastern ruins, he bound his soul to bone. He did not die. He became the Bone King."),Narration=/Game/Audio/Recorded/Narration/Intro_04.Intro_04,Anchor=Objective_Shrine,From=(X=-2800,Y=-1800,Z=600),To=(X=-1800,Y=-2500,Z=150),LookAt=(X=0,Y=0,Z=-150),Fov=55)
+IntroShots=(Line=INVTEXT("His champions seized the ruins. His warband of dusk-born soldiers burned the fields. And the knights of Eldoria fell, one by one."),Narration=/Game/Audio/Recorded/Narration/Intro_05.Intro_05,Anchor=Objective_Ruins,From=(X=2400,Y=2200,Z=800),To=(X=1400,Y=1400,Z=350),LookAt=(X=0,Y=0,Z=-120),Fov=55)
+IntroShots=(Line=INVTEXT("Now his warband camps at the edge of the last free village, and Mordrak himself waits in its square, behind a ward that no blade can break."),Narration=/Game/Audio/Recorded/Narration/Intro_06.Intro_06,Anchor=Objective_WestCamp,From=(X=-2400,Y=1900,Z=600),To=(X=-1300,Y=1100,Z=280),LookAt=(X=0,Y=0,Z=-20),Fov=55)
+IntroShots=(Line=INVTEXT("Only one knight of the Silver Oath still stands. Sir Aldric. Exiled. Forgotten. And come home."),Narration=/Game/Audio/Recorded/Narration/Intro_07.Intro_07,Anchor=Hero,From=(X=380,Y=-60,Z=-10),To=(X=240,Y=-40,Z=10),LookAt=(X=0,Y=0,Z=45),Fov=40)
+IntroShots=(Line=INVTEXT("Break the warband. Cut down the champions at the ruins. Climb to the Sky Shrine and take back the Royal Key. Then end the Bone King's reign."),Narration=/Game/Audio/Recorded/Narration/Intro_08.Intro_08,Anchor=Hero,From=(X=160,Y=320,Z=40),To=(X=-120,Y=330,Z=70),LookAt=(X=0,Y=0,Z=30),Fov=50)
+IntroShots=(Line=INVTEXT("Rise, Sir Aldric. Eldoria is waiting."),Narration=/Game/Audio/Recorded/Narration/Intro_09.Intro_09,Anchor=Hero,From=(X=-250,Y=120,Z=90),To=(X=-420,Y=70,Z=120),LookAt=(X=0,Y=0,Z=60),Fov=70)

