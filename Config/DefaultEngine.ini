t.MaxFPS=60
; Hardware occlusion queries test against last frame's depth, so a fighter lunging, flinching or flying
; through a knockdown was sometimes hidden while in plain view (enemies "vanishing" mid-fight).
; Nanite and Lumen do their own culling, and switching these off costs no measurable frame rate here.
r.AllowOcclusionQueries=0

